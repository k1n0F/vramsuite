# Push a v* tag (e.g. v0.5.0) whose version matches pyproject.toml:
# tests -> PyPI (Trusted Publishing, no tokens) -> Windows exe -> GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tag matches pyproject version
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi
      - run: uv run --with pytest pytest -q

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: package
    runs-on: ubuntu-latest
    # Must match the environment name in the PyPI trusted publisher settings.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build vramsuite.exe
        run: >
          uv run --with pyinstaller pyinstaller --onefile --console --name vramsuite
          --collect-submodules vramsuite --collect-submodules rich --copy-metadata vramsuite
          --noconfirm vramsuite/__main__.py
      - name: Smoke test
        run: dist/vramsuite.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: dist/vramsuite.exe

  release:
    needs: [pypi, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: dist/
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha=$(sha256sum dist/vramsuite.exe | cut -d' ' -f1)
          # This version's section of CHANGELOG.md, then the fixed part with the checksum.
          awk -v v="$version" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          sed -e "s/{VERSION}/$version/g" -e "s/{SHA256}/$sha/g" .github/release-notes.md >> notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/vramsuite.exe --title "VRAM Suite $GITHUB_REF_NAME" --notes-file notes.md
