[project]
name = "vramsuite"
version = "0.4.0"
description = "Predictive GPU memory framework for AI inference workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "k1n0F" }
]
license = { text = "MIT" }

dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2"
]

[project.scripts]
vramsuite = "vramsuite.cli.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Real errors only (syntax, undefined names, unused imports). Without an
# explicit select, newer Ruff versions enable style rules that flag
# idiomatic code here (typer.Option defaults, deliberate broad excepts).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"